# Specifies the location of the spring context file added automatically to the global platform application context.
cxtranslations.application-context=cxtranslations-spring.xml
cxtranslations.global-context=cxtranslations-global-spring.xml

# Specifies id of the default catalog to be used to find labels when it cannot be determined from the session or the current site
cxtranslations.default.catalog.id=

#Use for generating static swagger documentation
cxtranslations.documentation.static.generate=true
ext.cxtranslations.extension.webmodule.webroot=/occ/v2

#Enables CX Translate for backend-side translations
cxtranslations.backendTranslations.messageSourceAspect.enabled=true

# Cache settings
cxtranslations.cache.enabled=true
cxtranslations.cache.cachePolicy=LRU
cxtranslations.cache.cacheSize=10000
cxtranslations.cache.timeToLiveSeconds=3600
cxtranslations.cache.region=cxLocalizedLabelCacheRegion

# Configuration
cxtranslations.import.allowed=true
cxtranslations.include.empty.values=false
cxtranslations.i18next.suffixes=_0,_1,_2,_3,_plural,_one,_other,_few,_many

# Translation cron job
cxtranslations.cronjob.nodegroup=backgroundProcessing
# from 1 to 10
cxtranslations.cronjob.priority=4

# Autoconfiguration
cxtranslations.autoconfig.enabled=true

# In case a proposed translation has been created but there is nothing to translate - remove the item
cxtranslations.proposedtranslation.autoremove.missing.targetlanguages=true
# In case a proposed translation has been created but there is no source value to translate - remove the item
cxtranslations.proposedtranslation.autoremove.missing.sourcevalue=true


# Create the configuration only for attributes that actually hold data
cxtranslations.autoconfig.checkdata.enabled=true
# Comma-separated list of patterns for excluding catalog versions
cxtranslations.autoconfig.customUniqueFields=ConsentTemplate->[baseSite.uid,id,version],SolrIndexedProperty->[solrIndexedType.Identifier,name],SnField->[indexType.id,id]
cxtranslations.autoconfig.excluded.catalogPatterns=_boconfig
# Comma separated list of excluded types for which the autoconfiguration should not be executed
cxtranslations.autoconfig.excluded.types=BackofficeRole,Theme,SavedQuery,RendererTemplate,WorkflowTemplate,AbstractWorkflowAction,WorkflowActionTemplate,AutomatedWorkflowActionTemplate,AbstractConstraint
# Comma separated list of excluded properties for which the autoconfiguration should not be executed. In format of <type>.<property>
cxtranslations.autoconfig.excluded.properties=BaseSite.locale,
# Merge mode for running the autoconfiguration again
# * KEEP_EXISTING - avoid updating configuration if already exists, keep existing one
# * REPLACE - create the configuration again
cxtranslations.autoconfig.merge.mode=REPLACE

# Custom timeout configuration, as translation request can take a long time in case of long texts or many target languages.
# 1200000 = 20min
cxtranslate.outboundservices.request.execution.timeout.millisecs=1200000

# Limit the number of sugestions shown in the frontend component while typing in the search terms
cxtranslations.keysuggestions.limit=30


# user groups for logged in ASM agents or frontend user that allow the frontend component to be visible
cxtranslations.frontend.usergroups=frontendTranslatorGroup,cmstranslatorgroup

# CMS translation tree traversal: attributes to skip when discovering child CMS items.
# Format: comma-separated TypeRegex:QualifierRegex pairs (both sides are Java regex patterns).
# Examples:
#   .*:containers            - skip 'containers' on any type
#   AbstractCMSComponent:slots - skip 'slots' only on AbstractCMSComponent subtypes
#   SomeComponent:.*         - skip all attributes on SomeComponent
#
# Base list — replaces the built-in defaults when set explicitly.
cxtranslations.cms.tree.skip.patterns=.*:containers,.*:restrictions,.*:parents,.*:slots
#
# Extra list — merged on top of the base list. Use for project-specific additions
# without overriding the defaults (e.g. cxtranslations.cms.tree.skip.patterns.extra=.*:cmsRows).
cxtranslations.cms.tree.skip.patterns.extra=.*:cmsRows

cxtranslate.integrations.azuretranslator.storage.container=
