cxtranslations.translate.automaticPlurals=Automatic plural handling:
cxtranslations.translate.automaticPluralsInfo.html=When enabled, all plural forms of selected Labels (for example `cartItems.cartTotal` and `cartItems.cartTotal_other`) will be grouped and translated to all plural forms defined for the target language. <a href="https://www.unicode.org/cldr/charts/48/supplemental/language_plural_rules.html" target="_blank">CLDR rules</a> are used to determine which forms are needed.
cxtranslations.translate.automaticPluralsInfo.plainText=When enabled, all plural forms of selected Labels (for example `cartItems.cartTotal` and `cartItems.cartTotal_other`) will be grouped and translated as to all plural forms defined for the target language. CLDR rules are used to determine which forms are needed.
