<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cx Translations</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="./assets/custom-stylesheet.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app"></div>
  <script>

    const LAST_MODIFIED = '<p style="text-align: end;"><em>Last modified {docsify-updated}</em></p>' + '\n\n';

    window.$docsify = {
      formatUpdated: '{MM}/{DD}/{YYYY}',
      name: 'Cx Translations',
      auto2top: true,
      coverpage: true,
      onlyCover: true,
      loadSidebar: true,
      subMaxLevel: 3,
      loadNavbar: true,
      mergeNavbar: true,
      search: {
        placeholder: 'Search'
      },
      plugins: [
        function addPageTimestamp(hook) {
          hook.beforeEach(function (markdown) {
            return LAST_MODIFIED + markdown;
          })
        }
      ]
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Docsify - plugins (https://docsify.js.org/#/plugins) -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-drawio/viewer.min.js"></script>
  <script src='//cdn.jsdelivr.net/npm/docsify-drawio/drawio.js'></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="https://unpkg.com/docsify-plugin-flexible-alerts"></script>

</body>
</html>
